{% if archivos %}
    <ul>
        {% for archivo in archivos %}
            <li>
                <a href="/subidas/{{ archivo.nombre }}">{{ archivo.nombre }}</a>
                <small>({{ archivo.tamano }})</small>
                <button class="borrar" hx-delete="/archivos/{{ archivo.nombre | urlencode }}" hx-target="#archivos" hx-confirm="¿Borrar este archivo?">Borrar</button>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>Todavía no hay archivos.</p>
{% endif %}
